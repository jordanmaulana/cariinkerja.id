# Frontend container: serves the built SPA and forwards the public Skill Map
# pages (/skill/, rendered by Django) to the backend container, so the host
# reverse proxy only needs cariinkerja.id -> this container.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects: behind the host proxy, nginx must not put its own
    # port (3000) or scheme into a Location header.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Resolve "backend" through Docker's DNS on each request, so nginx starts
    # even when the backend is down and follows it when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location = /skill {
        return 301 /skill/;
    }

    location /skill/ {
        proxy_pass $backend;
        # Django accepts this host because it matches FRONTEND_URL
        # (core/settings.py adds it to ALLOWED_HOSTS).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite's hashed bundles never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the SPA shell so a deploy shows up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
